# ============================================================
#  Configuracao COMUM (independente de plataforma)
#  Qualquer chave aqui pode ser sobreposta por -Dchave=valor
# ============================================================

# Endereco do servidor Appium (Appium 2.x corre em /, sem /wd/hub)
appium.server.url=http://127.0.0.1:4723

# Timeouts (segundos)
newCommandTimeout=120

# Gestao de estado da app entre testes
#   noReset=true   -> nao limpa dados da app (mais rapido em local)
#   fullReset=true -> reinstala a app a cada sessao (ambiente limpo, mais lento)
noReset=false
fullReset=false

# Retries de testes instaveis (ver RetryAnalyzer)
maxRetries=1

# Gravacao de video do ecra (VideoRecorder)
#   video.enabled=true        -> grava o ecra durante cada teste
#   video.onlyOnFailure=true  -> so guarda o .mp4 quando o teste falha
# Os videos ficam em recordings/ e sao anexados ao relatorio Allure.
video.enabled=false
video.onlyOnFailure=true
