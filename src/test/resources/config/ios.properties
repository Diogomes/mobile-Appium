# ============================================================
#  Configuracao iOS (XCUITest) — requer macOS + Xcode
#  Ajusta os valores ao teu simulador/dispositivo e app.
# ============================================================

# Nome do simulador (ver `xcrun simctl list devices`)
device.name=iPhone 15

# Versao do iOS
platform.version=17.5

# --- Identificacao da app ---
# Opcao A: apontar para uma .app/.ipa local (sera instalada)
app.path=

# Opcao B: usar uma app ja instalada (bundle id)
app.bundleId=com.exemplo.app

noReset=true
