# ============================================================
#  Configuracao ANDROID (UiAutomator2)
#  Ajusta os valores ao teu emulador/dispositivo e app.
# ============================================================

# Nome do dispositivo/emulador (ver `adb devices`)
device.name=Android Emulator

# Versao do Android (opcional; util quando ha varios dispositivos)
platform.version=14.0

# --- Identificacao da app ---
# Opcao A: apontar para um .apk local (sera instalado)
app.path=

# Opcao B: usar uma app ja instalada (preenche package + activity)
app.package=com.exemplo.app
app.activity=com.exemplo.app.MainActivity

# Em local costuma ser pratico nao limpar dados a cada teste
noReset=true
